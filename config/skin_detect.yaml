# -*- coding: utf-8 -*-
# skin_detect.yaml —— M1 肤色检测参数（owner: B）
# B 自有参数：颜色候选 + 确定性图割共识；当前说明见 report/lht_skin_surface_20261030.md。

# 色彩空间判定阈值（YCrCb 经验区间，供实现参考）
ycbcr:
  cr_min: 133
  cr_max: 173
  cb_min: 77
  cb_max: 127

# 掩码后处理
postprocess:
  enabled: true
  morph_kernel: 5
  min_area_ratio: 0.001

# 空间分割面向居中单人肖像；坐标、半径均相对整图宽高归一化。
# 缺少此块或关闭时兼容原颜色阈值，不加载任何预训练模型。
spatial:
  enabled: true
  center: [0.5, 0.48]
  roi_radius: [0.4, 0.43]
  seed_radius: [0.15, 0.2]
  iterations: 3
  gmm_iterations: 10
  workers: 3
  vote_threshold: 2
  profiles:
    - {space: gray, working_size: 256, trusted: false, bright_seed: false}
    - {space: bgr, working_size: 512, trusted: true, bright_seed: false}
    - {space: bgr, working_size: 512, trusted: true, bright_seed: true}
  # 最终皮肤轮廓不得按固定整图椭圆裁掉面颊和下颌。
  face_ellipse: null
  coverage_recovery:
    enabled: true
    working_size: 512
    # 以下两项仅用于surface关闭时的旧恢复模式。
    lower_quantile: 0.55
    horizontal_padding: 0.25
  # 连续皮肤作用域包含鼻子；首轮主体引导第二轮分割，按暗结构和唇色保护五官。
  surface:
    enabled: true
    horizontal_radius: 0.1
    vertical_radius: 0.3
    upper_radius: 0.03
    recover_highlights: true
    protect_features: true
  exclude_ellipses: []

