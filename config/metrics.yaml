# -*- coding: utf-8 -*-
# metrics.yaml —— M7 指标与评测协议参数（owner: C，协议变化须共同评审）
# 数值为 v1.0 预设基线，试测后如需调整走 change-request。

# 评测集
manifest: assets/evaluation_manifest.csv
expected_samples: 40
scenes: [normal, backlight, lowlight, blemish, blur]

# 指标阈值（验收基线）
thresholds:
  skin_iou: 0.75
  skin_recall: 0.80
  variance_drop_min: 0.20
  variance_drop_max: 0.40
  epi: 0.80
  exposure_gain: 0.15
  overexposure_ratio: 0.01
  delta_e2000: 5.0
  psnr_delta_db: 0.5
  ssim_delta: 0.02
  hf_ratio_min: 0.70
  hf_ratio_max: 1.30

# 评测协议常量（3.4 节）
protocol:
  skin_erode_kernel: 11
  variance_window: 7
  epsilon: 1.0e-6
  hf_sigma: 3.0
  border_type: BORDER_REFLECT_101
  float_tolerance: 1.0e-6

# 模块隔离评测的固定合成退化参数（与 config_id 一起记录）
degradation:
  motion_blur:
    psf_length: 15
    psf_angle: 0.0
    noise_sigma: 0.01
    seed: 42
  color_cast:
    rgb_gains: [1.25, 0.90, 0.75]

# 匿名问卷只返回汇总数据；CSV 持久化仍由 A 的 io 层负责
survey:
  minimum_valid_responses: 20
  expected_pairs: 10
  score_min: 1
  score_max: 5
  questions: [naturalness, texture_preservation, facial_detail, skin_tone]
