name: tests

# 回归流水线（对齐设计方案 6.5）：
# - pull_request / push main：快速回归（单测 + 契约守卫）
# - push main / 手动：全量回归（含 integration，需自行配置数据根目录）
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-regression:
    name: unit-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests + contract guard
        run: python -m pytest -m "not integration"

  contract-guard:
    name: contract-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify frozen contracts
        run: python -m pytest tests/unit/test_contracts.py -v

  integration-regression:
    name: integration-regression
    runs-on: ubuntu-latest
    # 只在合并到 main 或手动触发时执行；CI 不下载受限数据。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run integration regression
        # 无本地数据集时用例会明确报告「前置条件未满足」，不伪装为通过。
        run: python -m pytest -m integration -v