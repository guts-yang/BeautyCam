name: tests

# 回归流水线（对齐设计方案 6.5）：
# - pull_request / push main：快速回归（单测 + 契约守卫）
# - push main / 手动：全量回归（含 integration，需自行配置数据根目录）
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-regression:
    name: unit-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
- name: Run unit tests + contract guard
        run: python -m pytest -m "not integration and not end_to_end"

  contract-guard:
    name: contract-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify frozen contracts
        run: python -m pytest tests/unit/test_contracts.py -v

integration-regression:
    name: integration-regression
    runs-on: ubuntu-latest
    # 端到端用例用合成数据 + 临时目录，不需要数据集，因此随 PR 与 push 都执行。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.x"
      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run end-to-end regression
        # 需要本地数据集的 `integration` 用例在此不选，由本地 / 手动全量回归覆盖。
        run: python -m pytest -m end_to_end -v